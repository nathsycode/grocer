<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grocer — review and approve a simulated cart</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="app" class="app">
      <header id="top" class="top"></header>
      <div id="strip" role="status" aria-live="polite"></div>
      <main id="main" class="stage" tabindex="-1"><p class="loading">Loading local state…</p></main>
      <footer id="bar" class="bar"></footer>
      <div id="drawer"></div>
      <div id="overlay"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <noscript>
      <p class="noscript">This review UI needs JavaScript. The backend runs independently; nothing is executed by this page.</p>
    </noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
